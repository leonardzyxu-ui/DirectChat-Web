services:
  - type: web
    name: directchat-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECTCHAT_STATIC_ROOT
        value: .
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DIRECTCHAT_LEGACY_MIGRATION_ORIGIN
        value: https://directchat-relay.onrender.com
      - key: DIRECTCHAT_LEGACY_MIGRATION_TARGET
        value: https://directchat.srv1921833.hstgr.cloud
      # Temporary one-shot encrypted vault transport. Set all of these only
      # for the migration deployment, remove them immediately after its
      # aggregate-only acceptance log is recorded, then redeploy.
      - key: DIRECTCHAT_LEGACY_VAULT_EXPORT_ENABLED
        sync: false
      - key: DIRECTCHAT_LEGACY_VAULT_EXPORT_AUTORUN
        sync: false
      - key: DIRECTCHAT_LEGACY_VAULT_IMPORT_URL
        sync: false
      - key: DIRECTCHAT_LEGACY_VAULT_IMPORT_TOKEN
        sync: false
      - key: DIRECTCHAT_LEGACY_VAULT_TRANSPORT_KEY
        sync: false
